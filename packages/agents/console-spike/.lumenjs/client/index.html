<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>Agent Console (spike)</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  
  <!-- Everything index.html held in <head> that is not the title.
     LumenJS reads head.html verbatim into the document head, which is where
     the console's two global concerns belong: the meta tag it reads at
     runtime, and the token sheet the whole design hangs off. Neither can
     live in a layout — a layout renders into a shadow root, and `:root`
     custom properties and a `<meta>` are document-level things. -->

<!-- Where artifacts are served from, if anywhere.
     An artifact is a body a model wrote, and it renders as itself only on a
     host that holds nothing worth stealing — the one named by the API's
     AGENTS_PREVIEW_HOST. Empty means "nowhere is isolated", and the console
     then reads previews through /api, where the server answers text/plain
     and the bytes are inert. That is the safe default: a deployment without
     a separate host for artifacts does not get to render them.
     Set both to the same host, or neither. -->
<!-- The preview host rides the same Cloudflare tunnel as the console, so it
     is https like the console — a plain-http origin here is mixed content
     inside the https console, and the browser blocks the frame outright. -->
<meta name="agents-preview-origin" content="https://lumen-artifacts.the-agent.dev" />
<style>
  /* One vocabulary for the whole console, held at the root.
     The Kimi reading (KIMI-DESIGN.md): text and fills are BLACK AT AN
     OPACITY, not a grey ramp — every level stays legible on any surface,
     and hover/active are steps of the same ink rather than new colours.
     The ground is warm (#fbfaf9), the content sheet is white, and the two
     separate by that delta — borders barely exist. */
  :root {
    --bg: #FFFFFF;          /* the content sheet */
    --bg-rail: #FBFAF9;     /* the warm ground: sidebar, panels, nav */
    --bg-card: #FFFFFF;
    --bg-sunken: rgba(0,0,0,.045);  /* Kimi Fills-F2: hover washes, chips */
    --bg-user: rgba(0,0,0,.045);
    --fill-1: rgba(0,0,0,.03);      /* the lightest wash */
    --fg: rgba(0,0,0,.9);
    --muted: rgba(0,0,0,.45);
    --faint: rgba(0,0,0,.3);        /* placeholders, quaternary ink */
    --border: rgba(0,0,0,.09);
    /* The action colour is ink, not a hue. */
    --accent: #17171A;
    --accent-hover: #000000;
    --accent-fg: #FFFFFF;
    --focus: #2563EB;
    --brand: #17171A;
    --danger: #B3261E;
    --ok: #157F4D;
    --display: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  agent-console { display: flex; height: 100%; }

  /* New under LumenJS, and the only rules here that index.html did not have.
     The console is no longer a direct child of <body>: the framework mounts
     <nk-app> → #nk-router-outlet → <layout-root> → <page-index> above it.

     Each link in that chain carries the height, because `height: 100%` only
     resolves through ancestors that have one. `display: contents` looks like
     the tidier answer — no boxes at all — and it is wrong: an element with
     no box gives the console nothing to resolve 100% against, the shell
     falls back to content height, and the sidebar stops reaching the bottom
     of the window while the chat column still fills it. That is visible in a
     screenshot and was caught in one. */
  nk-app, #nk-router-outlet, layout-root, page-index { display: block; height: 100%; }

  /* The router gives the outlet `tabindex="-1"` and focuses it after every
     navigation, so screen-reader and keyboard users land in the new page.
     Chromium answers that with its default focus ring, and the outlet spans
     the viewport — so the ring is a 1px dark rectangle around the whole
     console, drawn on first paint before anyone has pressed a key.
     Suppressed only for the outlet, which is a programmatic focus target and
     not a control anybody tabs to; every real control keeps its ring. */
  #nk-router-outlet:focus { outline: none; }
</style>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
    nk-app { display: block; min-height: 100vh; }
  </style>
  <script type="module" crossorigin src="/assets/__nk_build_index-cfUmou0i.js"></script>
</head>
<body>
  <script type="application/json" id="__nk_prefetch__">viewport</script>
  
  
  
  <nk-app></nk-app>
  
</body>
</html>
