<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Joule">
  <!-- The wordmark's first letter and its period — the same two marks the
       home screen and the rail draw, at the one size where a tile would be a
       black smudge.

       No container. A rounded square is what an app icon needs and what a tab
       does not: at 16px the tile eats most of the pixels and the letter that
       identifies the site gets the rest. The PNGs beside this one keep their
       tile, because a home-screen icon with a transparent ground is given a
       white box by the operating system.

       The stroke is a stroke rather than an outlined path so the J stays the
       same shape at every size and can take a colour from a media query.
       The period keeps the accent in both themes: it is the one element of
       this identity that is not ink, and it is what makes a lone J read as
       this product rather than as any J. -->
  <style>
    .j { stroke: #17171A; }
    @media (prefers-color-scheme: dark) { .j { stroke: #FFFFFF; } }
  </style>
  <path class="j" d="M36 8 V34 a12 12 0 0 1 -24 0" fill="none" stroke-width="13"/>
  <circle cx="52" cy="45" r="6.5" fill="#8B5CF6"/>
</svg>
