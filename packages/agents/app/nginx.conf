# One origin: the page and its API on the same host, so CORS never exists.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Previews live at the root, so an artifact's relative links resolve to its
  # own siblings rather than to something under the console's prefix.
  location /preview/ {
    proxy_pass http://api:8100/preview/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_read_timeout 60s;
  }

  location /api/ {
    proxy_pass http://api:8100/;
    proxy_http_version 1.1;
    # The browser's own Host, port and all — not nginx's upstream name.
    #
    # Without this, nginx sends `Host: api:8100`, so the API sees the same host
    # whichever address the browser asked for. The preview route decides
    # text/html vs text/plain on exactly that header, and with it rewritten the
    # decision is made on a value no browser ever sent: previews stay inert
    # forever, and an operator who "fixes" it by setting AGENTS_PREVIEW_HOST=api
    # turns every origin — including the console's — into one that answers
    # model-authored HTML as HTML.
    proxy_set_header Host $http_host;
    # WebSocket upgrade, for when the run stream lands on this path.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
