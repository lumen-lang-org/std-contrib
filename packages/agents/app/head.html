<!-- Everything index.html held in <head> that is not the title and not the
     preview origin. LumenJS reads this file verbatim into the document head,
     which is where the token sheet belongs: `:root` custom properties are a
     document-level thing and a layout renders into a shadow root, where
     `:root` means nothing.

     The preview-origin <meta> is the other document-level thing, and it is
     NOT here — it became layout config in pages/_layout.ts so a deployment
     can set it without editing a file baked into the image. -->
<!-- The viewport, restated so it says viewport-fit=cover.

     Without that key every env(safe-area-inset-*) resolves to 0 on iOS. That
     is not a subtlety — it silently disables the mechanism, so the composer's
     reserve for the home indicator and the home bar's own inset were both
     arithmetic on zero, and the input still sat under Safari's toolbar after
     two rounds of "fixing" it. The insets are only reported to a page that
     has said it will draw into them.

     A second <meta name="viewport"> rather than an edit to the first: the
     first is emitted by LumenJS itself (dist/dev-server/index-html.js), so
     there is no app file holding it. The later tag wins, and this file is
     read into the head after the framework's own tags — verified against the
     served document, not assumed.

     interactive-widget is carried over verbatim from the framework's tag,
     because restating the viewport replaces it: dropping the key here would
     turn the on-screen keyboard back into something that overlays the
     composer instead of resizing the page under it. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<style>
  /* One vocabulary for the whole console, held at the root.
     The Kimi reading (KIMI-DESIGN.md): text and fills are BLACK AT AN
     OPACITY, not a grey ramp — every level stays legible on any surface,
     and hover/active are steps of the same ink rather than new colours.
     The ground is warm (#fbfaf9), the content sheet is white, and the two
     separate by that delta — borders barely exist. */
  :root {
    --bg: #FFFFFF;          /* the content sheet */
    /* Neutral, no longer the warm #FBFAF9. The warmth was real in the Kimi
       reading but invisible at 1.5 points of difference — and it was the one
       hued surface in the chrome, so phone browsers that auto-darken (hue-
       preserving inversion) turned the whole drawer BROWN against a neutral
       page. The console ships no dark palette of its own yet; until it does,
       every token has to survive being inverted, and neutral is what does. */
    --bg-rail: #FAFAFA;     /* the ground: sidebar, panels, nav */
    --bg-card: #FFFFFF;
    /* The composer's surface, and it is here rather than in console.ts for a
       reason worth keeping: nr-chatbot is not a child of the console's shadow
       root, so a rule for the tag there matches nothing — silently — and the
       token simply never existed. On :root it inherits into every shadow tree
       on the page, which is what a custom property is for.

       Why it needed naming at all: the library painted that surface with a
       literal #ffffff inside its own shadow root. On a phone browser that
       auto-darkens — a hue-preserving inversion, the same behaviour this
       file's note above records for the drawer — an inverted literal and an
       inverted --bg-card are not obliged to land on the same grey, and they
       did not. The composer read as a slightly different colour from every
       other white surface, in dark mode only, which is exactly the report.
       One token, so both invert as one thing. */
    --nuraly-chatbot-input-bg: #FFFFFF;
    --bg-sunken: rgba(0,0,0,.045);  /* Kimi Fills-F2: hover washes, chips */
    --bg-user: rgba(0,0,0,.045);
    --fill-1: rgba(0,0,0,.03);      /* the lightest wash */
    --fg: rgba(0,0,0,.9);
    --muted: rgba(0,0,0,.45);
    --faint: rgba(0,0,0,.3);        /* placeholders, quaternary ink */
    --border: rgba(0,0,0,.09);
    /* The action colour is ink, not a hue.
       Borrowing another product's indigo and magenta would have made this
       console look like that product — the layout patterns are worth taking,
       the identity is not. It also frees every hue for the graph, where
       colour carries meaning: a node is orange because it is the entry
       agent, violet because it is a server. An accent competing with those
       would be read as one of them.
       So a primary action is a filled ink button, and the only saturated
       colour in the chrome is the focus ring. */
    --accent: #17171A;
    --accent-hover: #000000;
    --accent-fg: #FFFFFF;
    /* Focus is the one place a hue is louder than ink: it has to be found
       instantly, and it must not read as "primary". */
    --focus: #2563EB;
    /* The brand mark — the logo dot and the account avatar. Ink too, so
       nothing in the chrome competes with the graph. */
    --brand: #17171A;
    --danger: #B3261E;
    --ok: #157F4D;
    --display: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  /* --- dark ------------------------------------------------------------
     Every token restated, and that is the point rather than an excess. A
     partial dark palette is worse than none: --fg is black at 90%, so a dark
     --bg with the light ink still in place is black text on a black page.
     That is how the previous attempt at this failed — surfaces went dark,
     inks stayed, and individual pairs fell below legibility in places nobody
     had opened. So the rule here is that a dark value exists for every token
     above, in the same order, and tools/contrast.mjs holds the ink/surface
     pairs the console actually draws and prints a ratio for each.

     Until this block existed the console shipped no dark palette at all, and
     what a phone showed in dark mode was the BROWSER inverting the light one
     — a hue-preserving inversion that no one here chose and that landed the
     composer on a different grey from the page around it.

     The values follow Kimi's reading, measured rather than eyeballed: its
     page is rgb(24,24,23) and its composer rgb(31,31,31), so a surface you
     act on sits one step ABOVE the ground rather than below it. That is the
     inverse of the light theme's arrangement, where the rail is 2 points
     darker than the sheet, and it is not an inconsistency: light separates
     surfaces by removing light from the ground, dark separates them by
     adding it. Following the light theme's direction literally would have
     put the composer at #111 on a #181818 page, which reads as a hole. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181818;          /* the content sheet, Kimi's page, de-warmed */
      --bg-rail: #141414;     /* the ground, one step BELOW the sheet */
      --bg-card: #1F1F1F;     /* raised: cards, panels, menus */
      /* The composer, Kimi's values to the number: its card is rgb(31,31,31)
         on a rgb(24,24,23) page with a rgba(255,255,255,.12) hairline. Four
         tokens rather than one because the card's block in the library
         carries !important — the surface alone would have applied to the
         element, lost to that block, and left the border and the placeholder
         as black-on-black. */
      --nuraly-chatbot-input-bg: #1F1F1F;
      --nuraly-chatbot-surface: #181818;
      --nuraly-chatbot-input-border: rgba(255,255,255,.14);
      --nuraly-chatbot-input-border-focus: rgba(255,255,255,.30);
      --nuraly-chatbot-placeholder: rgba(255,255,255,.42);
      /* What you type. Near-black by default, which on this surface means the
         composer accepts text and shows none of it — the placeholder was
         tokenised long before the text that replaces it was. */
      --nuraly-chatbot-input-color: rgba(255,255,255,.92);
      /* The wordmark. 54px of near-black by default, which on a #181818 page
         is the largest piece of text on the screen painted the colour of the
         screen. */
      --nuraly-chatbot-brand-fg: rgba(255,255,255,.92);
      /* The + menu's panel. nr-dropdown defaults to a white card with near
         black rows, which on a dark page is a white rectangle over the
         composer — the one surface on the screen that had not been told what
         theme it is in. The tokens existed; nothing was setting them. */
      --nuraly-dropdown-background: #1F1F1F;
      --nuraly-dropdown-border-color: rgba(255,255,255,.12);
      --nuraly-dropdown-item-color: rgba(255,255,255,.92);
      --nuraly-dropdown-item-hover-bg: rgba(255,255,255,.07);
      --nuraly-dropdown-item-hover-color: #FFFFFF;
      /* nr-button's default type, which is what the composer's round + and
         the panel controls are. Three literals otherwise — a white pill with
         grey text — so + rendered as a filled white disc on the composer and
         read as a spinner rather than a control. The violet hover is the
         library's, kept as a hue that survives both grounds. */
      --nuraly-button-default-bg: transparent;
      --nuraly-button-default-border: rgba(255,255,255,.16);
      --nuraly-button-default-color: rgba(255,255,255,.75);
      --nuraly-button-default-hover-border: rgba(255,255,255,.34);
      --nuraly-button-default-hover-color: rgba(255,255,255,.95);
      --nuraly-button-default-active-bg: rgba(255,255,255,.07);
      /* The same ladder as the light theme, in the other ink. White at an
         opacity, not a grey ramp, so every level stays legible on any of the
         three surfaces above — which is the property the light palette was
         built for and the only reason it survives being restated. */
      --bg-sunken: rgba(255,255,255,.07);
      --bg-user: rgba(255,255,255,.07);
      --fill-1: rgba(255,255,255,.04);
      --fg: rgba(255,255,255,.92);
      /* .60 and .42, not the light theme's .45 and .30. White on dark reads
         dimmer than black on light at the same opacity — the light values
         transcribed straight across give 3.3:1 and 2.1:1, and the numbers
         here are where the same roles clear 4.5 and 3. (Those light figures
         are not a typo: the light palette is itself under AA at --muted and
         --faint. Left alone deliberately — it is the established reading and
         changing it is a design decision, not a dark-mode fix.) */
      --muted: rgba(255,255,255,.60);
      --faint: rgba(255,255,255,.42);
      --border: rgba(255,255,255,.12);   /* Kimi's border, to the number */
      /* The accent inverts wholesale. A primary action here is a filled ink
         button — near-black on white — and near-black on a near-black page
         is not a button, it is a hole with a label in it. So the ink becomes
         the light and the label becomes the dark, which keeps the rule the
         light theme states: the primary action is ink, never a hue, and every
         hue stays free for the graph. */
      --accent: #EDEDED;
      --accent-hover: #FFFFFF;
      --accent-fg: #17171A;
      --brand: #EDEDED;
      /* Lifted off their light values, which are chosen to be legible ON
         white and are simply too dark to be read on #181818: #2563EB gives
         2.4:1 there, #B3261E 2.2:1. These clear their thresholds while
         staying the same three signals — blue for focus, red for danger,
         green for done. */
      --focus: #7AA7FF;
      --danger: #FF8A80;
      --ok: #5DD39E;
    }
  }
  /* svh, and the three values are a ladder rather than indecision: a browser
     takes the last unit it understands, so this is 100% where nothing else is
     known, dvh where that is, and svh where THAT is.

     svh is the SMALL viewport — the height with every piece of browser chrome
     showing — and it does not change. dvh tracks the toolbar coming and going,
     which sounds better and is what this file said for months, and the
     composer still ended up under Safari's toolbar with no way to reach it.
     Three attempts at that bug assumed the layout was right and the composer
     was mispositioned inside it: safe-area padding, then viewport-fit=cover
     to make those insets non-zero, then locking the page's own scroll. Each
     was a real defect and none was this one.

     The trade svh makes is deliberate and visible: when the toolbar hides,
     the shell does NOT grow into the space it leaves, so there is a strip of
     background at the bottom. A composer that is always reachable is worth
     more than a page that fills the screen in a state the reader is passing
     through anyway.

     Not verifiable from here, and that is worth writing down: a headless
     WebKit has no toolbar, reports whatever viewport it was given, and
     reflows correctly under every one of these units — measured. This bug
     only exists on a real device, so this line is the one change in it whose
     proof is somebody's phone. */
  html, body { height: 100%; height: 100dvh; height: 100svh;
               height: var(--app-h, 100svh); margin: 0; }
  /* Nothing may scroll the page sideways. The console is a fixed shell with
     its own scrolling regions; a horizontal page scrollbar means some child
     is wider than the viewport, and on a phone that child drags the entire
     interface — header, rail and all — off the left edge. The template card
     row did exactly that. This is the backstop, not the fix: a wide region
     still needs its own overflow-x: auto. */
  html, body { overflow-x: hidden; }
  /* And nothing may scroll the page DOWN either, which is the half that was
     missing and the one a phone punishes.

     The console is a fixed shell: the transcript scrolls, the rail scrolls,
     the galleries scroll — the document never should. But only overflow-x was
     held, so the page kept a vertical scroll of its own, and on iOS that is
     exactly the gesture that slides the whole interface up under Safari's
     toolbar. The composer went with it: you could type and not see what you
     typed. Two rounds of safe-area padding could not reach this, because the
     composer was not mis-positioned in the layout — the layout was being
     scrolled out from under it.

     overflow-y and not `overflow`, so the x rule above keeps its own comment
     and its own reason. */
  html, body { overflow-y: hidden; }
  /* position: fixed, because on iOS the line above is a request, not a rule.

     WebKit does not honour overflow: hidden on html or body for scrolling the
     WINDOW — the layout viewport still pans under a drag, which is exactly the
     gesture a person makes reading a conversation. Every other engine obeys
     it, which is why the same build was fine in Firefox and wrong on the
     phone: the lock below the shell was only locked where it was already
     unnecessary.

     A fixed body is the one thing iOS does honour. It takes the document out
     of the panning system entirely: the layout viewport has nothing to
     scroll, so the shell stays put and the regions inside it that scroll on
     purpose keep doing so. inset: 0 with the measured height is the same
     geometry the shell already had. */
  /* Pinned at the TOP only, and sized by --app-h — never inset: 0.
     inset: 0 sets bottom: 0, which anchors the body to the bottom of iOS's
     LAYOUT viewport: the tall one, measured with the toolbar retracted. With
     both top and bottom pinned the body spans that full height and --app-h is
     overridden, so the composer at the body's bottom lands under the toolbar —
     exactly the report. top + left + an explicit height leaves the bottom
     free, so the measured visible height is the only thing deciding where the
     body ends, and the composer ends with it, above the chrome. */
  body { position: fixed; top: 0; left: 0; width: 100%;
         height: var(--app-h, 100svh); }
  /* And the min-height the framework adds back, taken off. LumenJS's own
     style block lands AFTER this file and says `body { min-height: 100vh }`.
     On iOS, 100vh is the LARGE viewport — the height with the toolbar hidden
     — so that one line forces the body taller than what is visible whenever
     the toolbar shows, and the composer at the body's bottom edge goes with
     it, below the fold. It is also why the bug arrived "after hydration":
     that stylesheet ships with the client bundle, so the SSR paint was the
     right height and the hydrated page grew past it. Firefox's 100vh is its
     real viewport, which is why the same build was fine there.
     `html body` (0,0,2) outweighs their bare `body` (0,0,1), so order stops
     mattering — the same trick, for the same reason, as the font rule below.

     nk-app is the SAME rule one line down in that framework block —
     `nk-app { min-height: 100vh }` — and missing it was the whole of why the
     last fix did not land. The body shrank to the measured height and nk-app,
     the first child, kept its 100vh minimum and simply overflowed it: the
     shell was the visible height plus the toolbar, and the composer sat at the
     bottom of THAT. Proven by forcing --app-h 90px short and walking the
     chain — html and body followed to 754, nk-app held 844. Both minimums
     have to be taken off, not just the body's. `html nk-app` (0,0,2) beats
     their bare `nk-app`. */
  html body, html nk-app { min-height: 0; }
  /* `html body`, not `body`, and the extra specificity is load-bearing.
     LumenJS writes its own <style> block into the shell AFTER this file
     (dev-server/index-html.ts), and that block sets `body { font-family:
     system-ui, -apple-system, sans-serif }`. A later rule of equal
     specificity wins, so a plain `body { font: ... }` here would keep its
     size and line-height and silently lose "Segoe UI" and Roboto — a
     different typeface on Windows and Android, and identical to index.html
     only on the machines we happen to develop on. One extra element
     selector settles it. */
  html body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  /* New under LumenJS, and the only rules here that index.html did not have.
     The console is no longer a direct child of <body>: the framework mounts
     <nk-app> → #nk-router-outlet → <layout-root> → <page-index> above it.

     Each link in that chain carries the height, because `height: 100%` only
     resolves through ancestors that have one. `display: contents` looks like
     the tidier answer — no boxes at all — and it is wrong: an element with
     no box gives the console nothing to resolve 100% against, the shell
     falls back to content height, and the sidebar stops reaching the bottom
     of the window while the chat column still fills it. That is visible in a
     screenshot and was caught in one during the phase 1 spike.

     All four are ordinary light-DOM elements — a shadow host is styled from
     the document like anything else — so this is one rule, not four :host
     blocks scattered across the layout and the page.

     index.html's fifth link, `agent-console { display: flex; height: 100% }`,
     is deliberately absent: the console now sits inside page-index's shadow
     root where a document rule cannot reach it, and console.ts's own
     `:host { display: flex; height: 100% }` has always said the same thing
     from the inside. The old rule was already redundant; here it would also
     be inert, which is worse than absent. */
  nk-app, #nk-router-outlet, layout-root, page-index { display: block; height: 100%; }

  /* The router gives the outlet `tabindex="-1"` and focuses it after every
     navigation, so screen-reader and keyboard users land in the new page.
     Chromium answers that with its default focus ring, and the outlet spans
     the viewport — so the ring is a 1px dark rectangle around the whole
     console, drawn on first paint before anyone has pressed a key.
     Suppressed only for the outlet, which is a programmatic focus target and
     not a control anybody tabs to; every real control keeps its ring. */
  #nk-router-outlet:focus { outline: none; }

  /* --- the shell, before anything hydrates -------------------------------
     Server rendering emits a declarative shadow root, styles included, only
     for the components it actually rendered — on a conversation that is
     agent-console, nr-chatbot and the icons. The console's own children (the
     rail, the header, the panels) arrive as bare tags and stay unstyled until
     the browser loads their module and upgrades them. That gap is the restyle
     you can see.

     Loading those modules on the server would close it and costs far too much:
     it is what made this route take 1.4s to first byte against 0.2s with the
     import guarded. So the shape is stated here instead. These rules are
     duplicated from the components' own `:host` blocks deliberately — they are
     the skeleton, not the design, and each one is a box the eye can see move
     if it is missing. Detail still arrives with the component; nothing shifts
     when it does.

     Keep this list short. Anything that does not change the position or the
     colour of a box belongs in the component that owns it. */
  agent-console { display: flex; height: 100%; }
  console-sidebar {
    width: 264px; flex: none;
    display: flex; flex-direction: column;
    background: var(--bg-rail); border-right: 1px solid var(--border);
  }
  /* The drawer breakpoint, restated for the same reason: below it the rail is
     off-canvas, and a rail that paints in-flow and then jumps out is worse
     than one that was never there. */
  @media (max-width: 1024px) {
    console-sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 60;
      transform: translateX(-100%);
    }
    agent-console[nav] console-sidebar { transform: none; }
  }
  /* The composer's gutter on a phone, measured off Kimi at 390px: its field
     sits at x=19, so ~19px of screen each side. Ours ran to x=8, close enough
     to the edge that the field's own 24px corner had nothing to be rounded
     against. Set on :root for the same reason as the surface above — the
     padding it feeds lives on .input-box inside nr-chatbot's shadow root,
     which no selector written in the app can reach. */
  @media (max-width: 640px) {
    :root { --nuraly-chatbot-gutter: 19px; }
  }
  /* Unupgraded custom elements are inline by default, so the composer and the
     panels collapse to a text-line's height before hydration and then snap to
     size. Naming them as blocks costs nothing and stops the snap. */
  nr-chatbot, workspace-panel, artifact-panel, knowledge-page, agent-canvas {
    display: block;
  }

</style>
<!-- The shell's height, measured rather than declared.

     Four CSS attempts at one bug — safe-area padding, viewport-fit=cover to
     make those insets real, locking the page's own scroll, then svh — and the
     composer was still under Safari's toolbar on a real phone. Each fixed
     something true; none fixed this. A headless WebKit reflows correctly under
     every one of those units, which is exactly why none of them could be
     tested here: the browser being wrong is the thing that cannot be
     reproduced without the browser.

     visualViewport is not a unit and does not need to be trusted: it is what
     the browser says is actually visible right now, toolbar and keyboard
     included. Writing it to --app-h makes the shell exactly that tall, so the
     composer's bottom is the bottom of what a person can see, whatever the
     chrome is doing.

     The CSS ladder above stays as the fallback for the first frame and for
     anything without the API — --app-h simply wins once it exists.

     resize AND scroll: iOS reports the toolbar collapsing as a scroll, not
     always as a resize. requestAnimationFrame coalesces the burst that a
     single gesture produces into one write. -->
<script>
  (function () {
    var vv = window.visualViewport;
    if (!vv) { return; }
    var queued = false;
    function apply() {
      queued = false;
      document.documentElement.style.setProperty("--app-h", vv.height + "px");
      // iOS pans the visual viewport over the layout viewport when the
      // toolbar collapses or the keyboard rises, and a fixed body does not
      // bring it back. pageTop is that pan; a shell that measures its own
      // height wants none of it.
      if (window.scrollY > 0) { window.scrollTo(0, 0); }
    }
    function schedule() {
      if (queued) { return; }
      queued = true;
      requestAnimationFrame(apply);
    }
    vv.addEventListener("resize", schedule);
    vv.addEventListener("scroll", schedule);
    window.addEventListener("orientationchange", schedule);
    apply();

    // The debug readout, on ?hud=1 only. Five fixes for the phone composer
    // were built on inference because no measurement from a real device ever
    // existed — headless WebKit has no toolbar and cannot be wrong the way a
    // phone is. This is the measurement: what the device says about itself,
    // on the screen a person can photograph. It costs nothing to anyone who
    // does not ask for it.
    if (/[?&]hud=1/.test(location.search)) {
      var hud = document.createElement("pre");
      hud.style.cssText = "position:fixed;top:60px;left:8px;z-index:99999;"
        + "background:rgba(0,0,0,.82);color:#7CFC9A;font:11px/1.5 monospace;"
        + "padding:8px 10px;border-radius:8px;margin:0;pointer-events:none;";
      document.addEventListener("DOMContentLoaded", function () {
        document.body.appendChild(hud);
      });
      var deep = function (root, tag, d) {
        if (d > 6) return null;
        var all = root.querySelectorAll("*");
        for (var i = 0; i < all.length; i++) {
          if (all[i].tagName.toLowerCase() === tag) return all[i];
          if (all[i].shadowRoot) {
            var hit = deep(all[i].shadowRoot, tag, d + 1);
            if (hit) return hit;
          }
        }
        return null;
      };
      setInterval(function () {
        var chat = deep(document, "nr-chatbot", 0);
        var box = chat && chat.shadowRoot
          ? chat.shadowRoot.querySelector(".input-box") : null;
        var b = box ? Math.round(box.getBoundingClientRect().bottom) : -1;
        var bodyH = Math.round(document.body.getBoundingClientRect().height);
        hud.textContent =
          "vv.h      " + Math.round(vv.height)
          + "\nvv.pageTop " + Math.round(vv.pageTop)
          + "\ninnerH    " + innerHeight
          + "\nscrollY   " + Math.round(window.scrollY)
          + "\nbody.h    " + bodyH
          + "\ndoc.sh    " + document.scrollingElement.scrollHeight
          + "\ninput.btm " + b
          + "\nclipped   " + (b > vv.height ? "YES by " + (b - Math.round(vv.height)) : "no");
      }, 500);
    }
  })();
</script>
