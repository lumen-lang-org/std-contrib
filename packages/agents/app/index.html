<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Console</title>
  <!-- Where artifacts are served from, if anywhere.
       An artifact is a body a model wrote, and it renders as itself only on a
       host that holds nothing worth stealing — the one named by the API's
       AGENTS_PREVIEW_HOST. Empty means "nowhere is isolated", and the console
       then reads previews through /api, where the server answers text/plain
       and the bytes are inert. That is the safe default: a deployment without
       a separate host for artifacts does not get to render them.
       Set both to the same host, or neither. -->
  <meta name="agents-preview-origin" content="http://artifacts.51.91.124.105.nip.io:5173" />
  <style>
    /* One vocabulary for the whole console, held at the root.
       Cool-biased neutrals rather than warm ones: the greys carry a trace of
       blue so a magenta mark and an indigo action both sit on them without
       going muddy. White is the content ground; the rails are a shade off it,
       which is what separates them without a heavy border.
       No display serif — the interface this follows has none, and a serif
       heading over a monospace id reads as two products. */
    :root {
      --bg: #FFFFFF;          /* content */
      --bg-rail: #FBFBFC;     /* sidebar, panels, nav */
      --bg-card: #FFFFFF;
      --bg-sunken: #F4F4F6;   /* mono chips, hover, the user's message block */
      --bg-user: #F1F1F4;
      --fg: #17171A;
      --muted: #6B6B76;
      --border: #E7E7EC;
      /* The action colour is ink, not a hue.
         Borrowing another product's indigo and magenta would have made this
         console look like that product — the layout patterns are worth taking,
         the identity is not. It also frees every hue for the graph, where
         colour carries meaning: a node is orange because it is the entry
         agent, violet because it is a server. An accent competing with those
         would be read as one of them.
         So a primary action is a filled ink button, and the only saturated
         colour in the chrome is the focus ring. */
      --accent: #17171A;
      --accent-hover: #000000;
      --accent-fg: #FFFFFF;
      /* Focus is the one place a hue is louder than ink: it has to be found
         instantly, and it must not read as "primary". */
      --focus: #2563EB;
      /* The brand mark — the logo dot and the account avatar. Ink too, so
         nothing in the chrome competes with the graph. */
      --brand: #17171A;
      --danger: #B3261E;
      --ok: #157F4D;
      --display: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    agent-console { display: flex; height: 100%; }
  </style>
</head>
<body>
  <agent-console></agent-console>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
